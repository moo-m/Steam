<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خوارزمية تصنيف الأفعال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>خوارزمية تصنيف الأفعال</h1>
            <p class="subtitle">الفعل الماضي المجرد</p>
        </header>

        <section id="word-box" class="word-box">
            <h3>صندوق الكلمات</h3>
            <div class="words">
                <span class="word">كتب</span>
                <span class="word">أكل</span>
                <span class="word">مدّ</span>
                <span class="word">وعد</span>
                <span class="word">قال</span>
                <span class="word">رمى</span>
            </div>
            <p class="instruction">اختر فعلاً في ذهنك، وسأعرفه من خلال بضعة أسئلة!</p>
            <button id="start-btn" class="btn primary">ابدأ اللعب</button>
        </section>

        <main id="game-area" class="hidden">
            <div class="stats">
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="counters">
                    <span>السؤال: <span id="question-count">0</span></span>
                </div>
            </div>

            <div class="question-card">
                <div id="genie-thinking" class="genie-thinking hidden">الجني يفكر...</div>
                <h2 id="question-text">هل يحتوي الفعل على حرف علة؟</h2>
                <div class="actions">
                    <button id="yes-btn" class="btn success">نعم</button>
                    <button id="no-btn" class="btn danger">لا</button>
                </div>
            </div>

            <div class="flowchart-container">
                <svg id="flowchart-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
                    <!-- Connections (Arrows) -->
                    <g class="arrows">
                        <path id="path-root-q1" d="M400,80 L400,120" class="arrow-path" />
                        
                        <!-- Root to Correct/Weak -->
                        <path id="path-q1-correct" d="M450,160 L600,160 L600,200" class="arrow-path" />
                        <path id="path-q1-weak" d="M350,160 L200,160 L200,200" class="arrow-path" />

                        <!-- Correct Path -->
                        <path id="path-correct-q2" d="M600,260 L600,300" class="arrow-path" />
                        <path id="path-q2-akal" d="M650,330 L720,330 L720,450" class="arrow-path" />
                        <path id="path-q2-q3" d="M550,330 L480,330 L480,380" class="arrow-path" />
                        <path id="path-q3-madda" d="M530,410 L580,410 L580,450" class="arrow-path" />
                        <path id="path-q3-kataba" d="M430,410 L380,410 L380,450" class="arrow-path" />

                        <!-- Weak Path -->
                        <path id="path-weak-q4" d="M200,260 L200,300" class="arrow-path" />
                        <path id="path-q4-waada" d="M150,330 L80,330 L80,450" class="arrow-path" />
                        <path id="path-q4-q5" d="M250,330 L320,330 L320,380" class="arrow-path" />
                        <path id="path-q5-qala" d="M270,410 L220,410 L220,450" class="arrow-path" />
                        <path id="path-q5-rama" d="M370,410 L420,410 L420,450" class="arrow-path" />
                    </g>

                    <!-- Nodes -->
                    <g class="nodes">
                        <rect id="node-root" x="320" y="30" width="160" height="50" rx="10" class="node start-node" />
                        <text x="400" y="60" text-anchor="middle" class="node-text">الفعل الماضي</text>

                        <polygon id="node-q1" points="400,120 470,160 400,200 330,160" class="node decision-node" />
                        <text x="400" y="165" text-anchor="middle" class="node-text small">حرف علة؟</text>

                        <rect id="node-correct" x="520" y="200" width="160" height="60" rx="10" class="node process-node green" />
                        <text x="600" y="235" text-anchor="middle" class="node-text">الفعل الصحيح</text>

                        <rect id="node-weak" x="120" y="200" width="160" height="60" rx="10" class="node process-node red" />
                        <text x="200" y="235" text-anchor="middle" class="node-text">الفعل المعتل</text>

                        <!-- Correct Sub-nodes -->
                        <polygon id="node-q2" points="600,300 670,330 600,360 530,330" class="node decision-node" />
                        <text x="600" y="335" text-anchor="middle" class="node-text x-small">همزة؟</text>

                        <polygon id="node-q3" points="480,380 550,410 480,440 410,410" class="node decision-node" />
                        <text x="480" y="415" text-anchor="middle" class="node-text x-small">تضعيف؟</text>

                        <!-- Weak Sub-nodes -->
                        <polygon id="node-q4" points="200,300 270,330 200,360 130,330" class="node decision-node" />
                        <text x="200" y="335" text-anchor="middle" class="node-text x-small">في البداية؟</text>

                        <polygon id="node-q5" points="320,380 390,410 320,440 250,410" class="node decision-node" />
                        <text x="320" y="415" text-anchor="middle" class="node-text x-small">في الوسط؟</text>

                        <!-- Result Nodes -->
                        <circle id="res-akal" cx="720" cy="480" r="35" class="node result-node" />
                        <text x="720" y="485" text-anchor="middle" class="node-text small">أكل</text>

                        <circle id="res-madda" cx="580" cy="480" r="35" class="node result-node" />
                        <text x="580" y="485" text-anchor="middle" class="node-text small">مدّ</text>

                        <circle id="res-kataba" cx="380" cy="480" r="35" class="node result-node" />
                        <text x="380" y="485" text-anchor="middle" class="node-text small">كتب</text>

                        <circle id="res-waada" cx="80" cy="480" r="35" class="node result-node" />
                        <text x="80" y="485" text-anchor="middle" class="node-text small">وعد</text>

                        <circle id="res-qala" cx="220" cy="480" r="35" class="node result-node" />
                        <text x="220" y="485" text-anchor="middle" class="node-text small">قال</text>

                        <circle id="res-rama" cx="420" cy="480" r="35" class="node result-node" />
                        <text x="420" y="485" text-anchor="middle" class="node-text small">رمى</text>
                    </g>

                    <!-- Genie Marker -->
                    <g id="genie-marker" class="genie-marker">
                        <circle r="15" fill="#6c5ce7" stroke="#fff" stroke-width="2" />
                        <text y="5" text-anchor="middle" font-size="12" fill="white">🧞</text>
                    </g>
                </svg>
            </div>
        </main>

        <section id="result-card" class="result-card hidden">
            <div class="card-content">
                <div class="genie-icon">🧞</div>
                <h2>لقد عرفتها!</h2>
                <p class="result-text">أنت تفكر بالفعل: <strong id="final-word">...</strong></p>
                <p class="result-type">التصنيف: <span id="final-type">...</span></p>
                <button id="restart-btn" class="btn primary">العب مرة أخرى</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
